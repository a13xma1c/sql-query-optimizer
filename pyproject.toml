[project]
name = "sqlanalyzer"
version = "0.1.0"
description = "Desktop SQL analyzer: syntax, lint, execution-plan and rule-based optimization for PostgreSQL, DuckDB, Trino and Snowflake"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["sql", "query-optimization", "execution-plan", "sqlglot", "postgresql", "duckdb", "trino", "snowflake"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "duckdb>=2.0.0",
    "duckdb-engine>=0.17.0",
    "graphviz>=0.21",
    "keyring>=25.0.0",
    "psycopg2-binary>=2.9.13",
    "pyside6>=6.12.0",
    "snowflake-sqlalchemy>=2.1.0",
    "sqlalchemy>=2.1.6",
    "sqlglot>=30.29.0",
    "trino>=0.340.0",
]

[project.scripts]
sqlanalyzer = "sqlanalyzer:main"
sqlanalyzer-demo = "sqlanalyzer.demo:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
    "mypy>=1.19",
    "pyyaml>=6.0",
]
packaging = [
    "pyinstaller>=6.16",
]

[tool.uv.build-backend]
# The wheel carries only the package (incl. the bundled samples/*.sql); the sdist additionally
# ships the tests and the demo scripts so it can be verified offline.
source-include = ["tests/**", "scripts/**"]
source-exclude = ["**/__pycache__", "**/*.pyc"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that drive the whole application against a database server (real or recorded)",
    "gui: end-to-end tests of the Qt user interface (offscreen)",
]

[tool.mypy]
python_version = "3.12"
files = ["src/sqlanalyzer", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
no_implicit_optional = true
show_error_codes = true
# Defaults (tests): imports and annotated helpers are checked, but the bodies of untyped test
# functions are not - they are full of "assert optional_thing.attr" idioms that are correct at
# runtime and pure noise for a type checker. The application code is held to a higher bar below.
check_untyped_defs = false
warn_unreachable = false

[[tool.mypy.overrides]]
module = ["sqlanalyzer", "sqlanalyzer.*"]
check_untyped_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["graphviz", "graphviz.*"]
ignore_missing_imports = true
